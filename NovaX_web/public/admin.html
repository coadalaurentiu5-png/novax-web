<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovaX - Admin Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .container { max-width: 1000px; width: 100%; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 0.85rem; }
        th, td { padding: 12px; border: 1px solid var(--border-color); text-align: left; }
        th { background: #090a0e; color: var(--text-sub); }
        tr:nth-child(even) { background: #10121a; }
        .badge { padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 0.75rem; }
        .badge.active { background: #103820; color: #4ade80; }
        .badge.banned { background: #381010; color: #f87171; }
        .btn { padding: 8px 12px; font-size: 0.75rem; cursor: pointer; border: none; border-radius: 6px; }
        .btn-reset { background: #3b82f6; color: white; }
        .btn-ban { background: #ef4444; color: white; }
        .btn-unban { background: #22c55e; color: white; }
        .admin-key-row { display: flex; gap: 10px; margin-bottom: 16px; }
        .admin-key-row input { flex: 1; }
        #msg { margin-top: 12px; font-size: 0.8rem; }
        .ok { color: #4ade80; }
        .err { color: #f87171; }
    </style>
</head>
<body>
    <div class="container">
        <header class="brand-header">
            <div class="logo-text">NOVA<span class="highlight">X</span> ADMIN</div>
            <p class="tagline">Gestionare Chei & HWID-uri</p>
        </header>

        <div class="admin-key-row">
            <input type="password" id="adminKeyInput" placeholder="Cheie de admin (dacă este setată)">
        </div>

        <!-- Secțiune comenzi Paysafecard -->
        <div class="main-card">
            <h3 style="margin:0 0 4px;">🧾 Comenzi Paysafecard</h3>
            <p style="color:var(--text-sub);font-size:0.8rem;margin-bottom:10px;">
                Verifică soldul PIN-ului manual, apoi marchează comanda ca verificată.
            </p>
            <button onclick="loadPaysafe()" class="btn" style="background:#f9a825;color:#111;">💳 Încarcă Comenzi Paysafe</button>
            <table>
                <thead>
                    <tr><th>Receipt ID</th><th>Email</th><th>Sumă</th><th>Produse</th><th>Status</th><th>Acțiune</th></tr>
                </thead>
                <tbody id="paysafeTable">
                    <tr><td colspan="6" style="text-align:center;">—</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        function adminHeaders() {
            const headers = { 'Content-Type': 'application/json' };
            const key = document.getElementById('adminKeyInput').value.trim();
            if (key) headers['x-admin-key'] = key;
            return headers;
        }

        function setMsg(text, ok = true) {
            const msg = document.getElementById('msg');
            if (msg) { msg.textContent = text; msg.className = ok ? 'ok' : 'err'; }
        }

        function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }
        function escAttr(s) { return String(s).replace(/['"\\`]/g, ''); }

        // ---- Comenzi Paysafecard ----
        async function loadPaysafe() {
            const tbody = document.getElementById('paysafeTable');
            try {
                const res = await fetch('/api/admin/paysafe', { headers: adminHeaders() });
                const data = await res.json();
                if (!res.ok || !data.success) { tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:#f87171;">Eroare sau neautorizat.</td></tr>'; return; }
                if (data.orders.length === 0) { tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;">Nicio comandă.</td></tr>'; return; }
                tbody.innerHTML = data.orders.map(o => `
                    <tr>
                        <td><code>${esc(o.receiptId)}</code></td>
                        <td>${esc(o.email||'—')}</td>
                        <td>${Number(o.amountEUR).toFixed(2)} €</td>
                        <td style="font-size:0.7rem;">${esc(o.items.map(i=>i.name+' x'+i.quantity).join(', '))}</td>
                        <td><span class="badge ${o.status==='completed'?'active':(o.status==='expired'?'banned':'')}">${esc(o.status.replace(/_/g,' '))}</span></td>
                        <td>
                            ${o.status==='pending_verification' ? `<button class="btn btn-unban" onclick="completePaysafe('${escAttr(o.receiptId)}')">✔ Marchează verificat</button>` : '—'}
                        </td>
                    </tr>
                `).join('');
            } catch (e) { tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:#f87171;">Eroare de conexiune.</td></tr>'; }
        }

        async function completePaysafe(receiptId) {
            if (!confirm(`Confirmi că ai verificat plata pentru ${receiptId}?`)) return;
            const res = await fetch('/api/admin/paysafe/complete', { method:'POST', headers: adminHeaders(), body: JSON.stringify({ receiptId }) });
            setMsg(res.ok ? 'Comanda marcată ca verificată.' : 'Eroare la actualizare.', res.ok);
            loadPaysafe();
        }

        // load on start
        loadPaysafe();
    </script>
</body>
</html>
