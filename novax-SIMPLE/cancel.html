<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plată anulată — NovaX</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .card { max-width: 440px; text-align: center; }
        .icon { font-size: 3rem; margin-bottom: 12px; }
        h1 { font-size: 1.5rem; margin-bottom: 8px; }
        .sub { color: var(--text-sub); font-size: 0.85rem; }
        .row { display: flex; gap: 10px; justify-content: center; margin-top: 18px; }
        button, a.btn { padding: 12px 20px; border: none; border-radius: 10px; font-weight: 700; cursor: pointer; text-decoration: none; display:inline-block; }
        .primary { background: var(--primary); color: #fff; }
        .ghost { background: transparent; color: var(--text-sub); border: 1px solid var(--border-color); }
    </style>
</head>
<body>
    <div class="main-card card">
        <div class="icon">🛒</div>
        <h1>Plata a fost anulată</h1>
        <p class="sub">Nu s-a efectuat nicio plată. Poți reveni oricând la coș și să încerci din nou.</p>
        <div class="row">
            <button class="primary" onclick="location.href='/'">Înapoi la site</button>
            <button class="ghost" onclick="history.back()">Înapoi la coș</button>
        </div>
    </div>
</body>
</html>
