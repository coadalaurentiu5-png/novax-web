<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovaX - Admin Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .container { max-width: 900px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 0.85rem; }
        th, td { padding: 12px; border: 1px solid var(--border-color); text-align: left; }
        th { background: #090a0e; color: var(--text-muted); }
        tr:nth-child(even) { background: #10121a; }
        .badge { padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 0.75rem; }
        .badge.active { background: #103820; color: #4ade80; }
        .badge.banned { background: #381010; color: #f87171; }
        .action-btn { padding: 6px 10px; font-size: 0.75rem; cursor: pointer; border: none; border-radius: 4px; margin-right: 4px; }
        .btn-reset { background: #3b82f6; color: white; }
        .btn-ban { background: #ef4444; color: white; }
        .btn-unban { background: #22c55e; color: white; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">NOVA<span>X</span> ADMIN</div>
            <p class="subtitle">Gestionare Chei & HWID-uri</p>
        </header>

        <main class="checkout-card">
            <button onclick="loadLicenses()" id="submitBtn" style="margin-bottom: 15px; width: auto; padding: 10px 20px;">
                🔄 Reîmprospătează Lista
            </button>

            <table>
                <thead>
                    <tr>
                        <th>Email</th>
                        <th>Cheie Licență</th>
                        <th>Plan</th>
                        <th>HWID Status</th>
                        <th>Status</th>
                        <th>Acțiuni</th>
                    </tr>
                </thead>
                <tbody id="licensesTable">
                    <tr><td colspan="6" style="text-align: center;">Se încarcă datele...</td></tr>
                </tbody>
            </table>
        </main>
    </div>

    <script>
        async function loadLicenses() {
            const res = await fetch('/api/admin/licenses');
            const data = await res.json();
            const tbody = document.getElementById('licensesTable');
            tbody.innerHTML = '';

            if (data.success && data.licenses.length > 0) {
                data.licenses.forEach(lic => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${lic.email}</td>
                        <td><code>${lic.key}</code></td>
                        <td>${lic.plan}</td>
                        <td>${lic.hwid ? '🔒 Locked' : '🔓 Unlocked'}</td>
                        <td><span class="badge ${lic.status}">${lic.status.toUpperCase()}</span></td>
                        <td>
                            <button class="action-btn btn-reset" onclick="resetHWID('${lic.key}')">Reset HWID</button>
                            ${lic.status === 'active' 
                                ? `<button class="action-btn btn-ban" onclick="toggleBan('${lic.key}', 'banned')">Ban</button>`
                                : `<button class="action-btn btn-unban" onclick="toggleBan('${lic.key}', 'active')">Unban</button>`
                            }
                        </td>
                    `;
                    tbody.appendChild(row);
                });
            } else {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align: center;">Nicio licență găsită.</td></tr>';
            }
        }

        async function resetHWID(key) {
            if(!confirm(`Resetezi HWID pentru ${key}?`)) return;
            await fetch('/api/admin/reset-hwid', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ key })
            });
            loadLicenses();
        }

        async function toggleBan(key, status) {
            if(!confirm(`Schimbi statusul pentru ${key} în ${status}?`)) return;
            await fetch('/api/admin/toggle-ban', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ key, status })
            });
            loadLicenses();
        }

        loadLicenses();
    </script>
</body>
</html>
